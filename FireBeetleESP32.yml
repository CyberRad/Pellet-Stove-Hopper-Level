esphome:
  name: pellet-stove-level
  friendly_name: Pellet Stove Level

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# Time Component (Required for correct timestamp)
time:
  - platform: sntp
    id: ha_time
    timezone: America/New_York 

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "<ESPHome Builder Home Assistant API Key>"

# Over The Air updates
ota:
  - platform: esphome
    password: "<Your OTA update password>"


# Your WiFi settings and fallback
wifi:
  ssid: !secret wifi_ssid < --- From Home Assistant ESPHOME Builder
  password: !secret wifi_password < --- From Home Assistant ESPHOME Builder

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pellet-Stove-Level"
    password: "<Unique password>"

captive_portal:
    
# A02YYUW data pins should be connected to GPIO16 and GPIO17
uart:
  id: uart_a02
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

sensor:
  # Raw distance - only for internal use
  - platform: a02yyuw
    id: hopper_distance_mm
    name: "Hopper Distance"
    uart_id: uart_a02
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    filters:
      - sliding_window_moving_average:
          window_size: 12
          send_every: 8     # Very slow internal updates

  # Battery
  - platform: adc
    id: battery_voltage
    pin: GPIO0
    name: "Battery Voltage"
    attenuation: 12db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    update_interval: 10min
    filters:
      - multiply: 2.0

  # Percent Full - Runs on its own 60s schedule
  - platform: template
    id: hopper_percent_full
    name: "Hopper Percent Full"
    unit_of_measurement: "%"
    icon: "mdi:percent"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (id(hopper_distance_mm).state <= 0 || isnan(id(hopper_distance_mm).state)) {
        return {};  
      }
      float distance_mm = id(hopper_distance_mm).state;
      
      const float DISTANCE_FULL = 127.0;     <----- Needs to be tuned to the value for a full hopper
      const float DISTANCE_EMPTY = 381.0;    <----- Needs to be tuned to the value for an empty hopper
      
      float percent = (DISTANCE_EMPTY - distance_mm) / (DISTANCE_EMPTY - DISTANCE_FULL) * 100.0;
      percent = clamp(percent, 0.0f, 100.0f);
      
      ESP_LOGI("hopper", "Distance: %.0f mm → Percent: %.0f%%", distance_mm, percent);
      return percent;

text_sensor:
  # Last Updated - Runs on its own 60s schedule
  - platform: template
    id: last_updated
    name: "Hopper Last Updated"
    icon: "mdi:clock-time-eight-outline"
    update_interval: 60s
    lambda: |-
      if (id(ha_time).now().timestamp == 0) {
        return {"Waiting for time sync..."};
      }
      static char time_str[20];
      time_t now = id(ha_time).now().timestamp;
      struct tm *timeinfo = localtime(&now);
      strftime(time_str, sizeof(time_str), "%Y-%m-%d %H:%M:%S", timeinfo);
      return {time_str};

binary_sensor:
  - platform: template
    name: "Hopper Low"
    id: hopper_low
    lambda: |-
      return id(hopper_percent_full).state < 20.0;
    icon: "mdi:alert-circle"